name: Update official macro results
on:
  push:
    branches: [main]
    paths: ['scripts/collect-macro-results.mjs', 'data/macro-consensus.json']
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 12-21 * * 1-5'
# Least privilege by default; only the publish job may write.
permissions:
  contents: read
concurrency:
  group: update-official-macro
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/collect-macro-results.mjs
      - name: Detect result change
        id: diff
        run: |
          if git diff --quiet -- data/macro-results.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Hand result facts to publish job
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: official-macro-results
          path: data/macro-results.json
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Write access only here; this job runs no npm install and no repository scripts.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: official-macro-results
          path: data
      - name: Publish result facts
        run: |
          jq empty data/macro-results.json
          if git diff --quiet -- data/macro-results.json; then echo "Results unchanged; nothing to commit."; exit 0; fi
          if [ "$(git status --porcelain)" != " M data/macro-results.json" ]; then git status --porcelain; echo "Unexpected files changed"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro-results.json
          git commit -m "data(news): refresh official macro results"
          git pull --rebase origin main
          git push origin HEAD:main
