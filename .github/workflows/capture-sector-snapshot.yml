name: Capture crypto sector snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/capture-crypto-tools.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-crypto-sector-snapshot
          path: previews/data/crypto-tools-snapshot.json
          retention-days: 2
