name: Retain daily taker history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/collect-flow-history.mjs', '.github/workflows/flow-history.yml']
  schedule:
    - cron: '17 1 * * *'
# Least privilege by default; only the publish job may write.
permissions:
  contents: read
concurrency:
  group: daily-taker-history
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/collect-flow-history.mjs
      - name: Detect history change
        id: diff
        run: |
          if git diff --quiet -- previews/data/crypto-flow-history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Hand retained history to publish job
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-taker-history
          path: previews/data/crypto-flow-history.json
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Write access only here; this job runs no npm install and no repository scripts.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: daily-taker-history
          path: previews/data
      - name: Publish retained history
        run: |
          jq empty previews/data/crypto-flow-history.json
          if git diff --quiet -- previews/data/crypto-flow-history.json; then echo "History unchanged; nothing to commit."; exit 0; fi
          if [ "$(git status --porcelain)" != " M previews/data/crypto-flow-history.json" ]; then git status --porcelain; echo "Unexpected files changed"; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/data/crypto-flow-history.json
          git commit -m 'data: retain verified daily taker observations'
          git pull --rebase origin main
          git push origin HEAD:main
