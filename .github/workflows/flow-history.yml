name: Retain daily taker history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/collect-flow-history.mjs', '.github/workflows/flow-history.yml']
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
concurrency:
  group: daily-taker-history
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/collect-flow-history.mjs
      - run: |
          if git diff --quiet -- previews/data/crypto-flow-history.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/data/crypto-flow-history.json
          git commit -m 'data: retain verified daily taker observations'
          git pull --rebase origin main
          git push origin HEAD:main
