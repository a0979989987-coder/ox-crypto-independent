name: Verify independent crypto site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:tools
      - run: npm run check
      - run: npm run verify:extraction
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Login layout and account flows (Chromium)
        run: node scripts/account-ui-check.mjs
      - name: Email cooldown and resend
        run: node scripts/account-email-ui-check.mjs
      - name: Login layout and account flows (WebKit)
        run: node scripts/account-ui-check.mjs
        env:
          OX_UI_BROWSER: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-login-verification
          path: docs/performance/login-*.png
          if-no-files-found: ignore
          retention-days: 2
      - run: npm run test:e2e
      - run: npm run test:performance
      - run: npm run test:news-rotation
      - run: npm run test:news-rotation
        env:
          OX_UI_BROWSER: webkit
      - run: npm run test:quotes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubble-ui-verification
          path: docs/performance/bubble-*.png
          if-no-files-found: ignore
          retention-days: 2
