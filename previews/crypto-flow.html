<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1012"><title>OX · Crypto Tools</title><style>html,body{margin:0;background:#0d1012;color:#f0eee8}#exit-screen{font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100dvh;display:grid;place-content:center;text-align:center;gap:22px}#exit-screen[hidden]{display:none}#exit-screen p{color:#a8b4b8;font-size:14px}#exit-screen button,#exit-screen a{font:inherit;color:#f0eee8;border:1px solid #607176;padding:13px 22px;border-radius:24px;background:#253239;text-decoration:none;cursor:pointer}</style></head><body><div id="crypto-flow"></div><section id="exit-screen" hidden><p>已退出 Crypto 工具。</p><button id="reopen">重新開啟工具</button><a href="../index.html">返回 OX</a></section><script type="module">import { mountCryptoFlow } from '../src/markets/crypto/analytics/flow-view.js'; const host=document.getElementById('crypto-flow'),exit=document.getElementById('exit-screen');let controller;async function open(){exit.hidden=true;host.hidden=false;controller=await mountCryptoFlow(host,{onExit(){controller?.destroy();host.hidden=true;exit.hidden=false;document.getElementById('reopen').focus();}});}document.getElementById('reopen').addEventListener('click',open);open();</script></body></html>
